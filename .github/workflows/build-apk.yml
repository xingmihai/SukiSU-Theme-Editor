name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "同时创建 Release 并附加 APK"
        type: boolean
        default: false
      release_tag:
        description: "Release 使用的 tag"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v0.1.0' }}

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships an Android SDK; fall back to a self-contained
      # cmdline-tools install if the image does not provide sdkmanager.
      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-unzip "$SDK/cmdline-tools/latest"
            unzip -q -o cmdline-tools.zip -d /tmp/cmdline-unzip
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdline-unzip/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" --list_installed | head -n 20 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git add -f build.log
          git commit -m "ci: build failure log" || true
          git push -f origin HEAD:ci-logs || true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(tail -c 50000 build.log)" || true

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "SukiSU-Theme-Editor-${RELEASE_TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Theme-Editor-APK
          path: SukiSU-Theme-Editor-*.apk
          if-no-files-found: error

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SukiSU 主题编辑器 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: SukiSU-Theme-Editor-*.apk

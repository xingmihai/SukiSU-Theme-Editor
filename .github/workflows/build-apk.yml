name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "同时创建 Release 并附加 APK"
        type: boolean
        default: false
      release_tag:
        description: "Release 使用的 tag"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v0.1.0' }}

jobs:
  build:
    name: Build debug + signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships an Android SDK; fall back to a self-contained
      # cmdline-tools install if the image does not provide sdkmanager.
      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-unzip "$SDK/cmdline-tools/latest"
            unzip -q -o cmdline-tools.zip -d /tmp/cmdline-unzip
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdline-unzip/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || true
          "$SDKMANAGER" --list_installed | head -n 20 || true

      # Fork PRs cannot read repository secrets. Fall back to a debug-only build.
      - name: Check signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "签名密钥可用，将构建签名 release APK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::签名密钥不可用（常见于 fork PR），仅构建 debug APK"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          KS="$RUNNER_TEMP/sukisu-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          # Sanity check without printing any secret material.
          head -c 4 "$KS" | od -An -tx1 | grep -q 'fe ed fe ed' || {
            echo "::error::解码后的文件不是 JKS keystore"; exit 1; }
          echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "keystore decoded: $(wc -c < "$KS") bytes"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Verify release APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未生成 release APK"; exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::找不到 apksigner，跳过签名校验"
            exit 0
          fi
          echo "apksigner: $APKSIGNER" | tee build-verify.log
          "$APKSIGNER" verify --verbose "$APK" 2>&1 | tee -a build-verify.log
          echo "--- certificate ---" | tee -a build-verify.log
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee -a build-verify.log

      - name: Upload build logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(tail -c 40000 build-*.log 2>/dev/null)" || true
          echo "构建日志已作为 commit comment 上报"

      - name: Upload build logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

      - name: Prepare APK artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "SukiSU-Theme-Editor-${RELEASE_TAG}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "SukiSU-Theme-Editor-${RELEASE_TAG}-release.apk"
          fi
          ls -lh SukiSU-Theme-Editor-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Theme-Editor-APK
          path: SukiSU-Theme-Editor-*.apk
          if-no-files-found: error

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SukiSU 主题编辑器 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: SukiSU-Theme-Editor-*.apk
